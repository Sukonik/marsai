[project]
name = "marsai-shipcore"
version = "0.3.0"
description = "MARSAI ShipCore: local, no-key companion service for the MARSAI HUD"
requires-python = ">=3.10"
license = { text = "See LICENSE" }
dependencies = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
status = ["psutil>=5.9"]
voice = ["faster-whisper>=1.0", "piper-tts>=1.2", "av>=13,<16"]

[project.scripts]
marsai-shipcore = "shipcore.__main__:main"

[tool.setuptools]
packages = ["shipcore", "shipcore.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
